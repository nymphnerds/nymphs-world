<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nymphs World</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d0f;
      --panel: #0d1517;
      --panel-2: #101b1e;
      --panel-3: #152124;
      --field: #071113;
      --line: #26383d;
      --line-soft: #1a2b30;
      --text: #eef5f2;
      --muted: #8fa7a2;
      --faint: #617671;
      --cyan: #26d7cf;
      --green: #9cdf5a;
      --amber: #f3be4f;
      --rose: #ff8068;
      --blue: #8cbcff;
      --shadow: rgba(0, 0, 0, 0.24);
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      letter-spacing: 0;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel-2);
      color: var(--text);
      padding: 4px 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: #3a6065;
      background: #152529;
    }

    button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    button.primary {
      border-color: #2b7674;
      color: #dffdfa;
      background: #123033;
    }

    button.icon {
      width: 28px;
      padding: 0;
      font-family: var(--mono);
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--field);
      color: var(--text);
      outline: none;
    }

    input,
    select {
      min-height: 30px;
      padding: 4px 8px;
    }

    textarea {
      resize: none;
      padding: 14px 16px;
      line-height: 1.55;
      font-family: var(--mono);
      font-size: 13px;
      tab-size: 2;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #43848a;
      box-shadow: 0 0 0 1px rgba(38, 215, 207, 0.16);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .app {
      height: 100vh;
      min-width: 780px;
      display: grid;
      grid-template-columns: minmax(236px, 260px) minmax(0, 1fr);
      background: var(--bg);
    }

    .app.has-context {
      grid-template-columns: minmax(236px, 260px) minmax(0, 1fr) minmax(250px, 280px);
    }

    .sidebar,
    .context {
      min-width: 0;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--line-soft);
    }

    .context {
      display: none;
      border-left: 1px solid var(--line-soft);
    }

    .app.has-context .context {
      display: flex;
    }

    .sidebar-head {
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .brand {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid #347980;
      border-radius: 4px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
    }

    .server-line {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-actions,
    .mini-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sidebar-actions {
      margin-top: 12px;
    }

    .section {
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
      min-height: 0;
    }

    .section.pages {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .section-head {
      min-height: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .count {
      color: var(--faint);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      text-transform: none;
    }

    .create-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 32px;
      gap: 6px;
    }

    .page-create {
      grid-template-columns: minmax(0, 1fr) 32px;
      margin-top: 6px;
    }

    .page-create input {
      grid-column: 1 / -1;
    }

    .search-line {
      margin-bottom: 8px;
    }

    .nav-list {
      display: grid;
      gap: 4px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      padding-right: 2px;
    }

    .project-list {
      max-height: 142px;
      margin-top: 8px;
    }

    .page-list {
      flex: 1;
    }

    .nav-row {
      width: 100%;
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      padding: 7px 8px;
      text-align: left;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 4px;
      overflow: hidden;
    }

    .nav-row:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.025);
    }

    .nav-row.is-active {
      border-color: #2f8b88;
      background: rgba(38, 215, 207, 0.08);
    }

    .nav-row > span:first-child {
      min-width: 0;
      overflow: hidden;
      display: block;
    }

    .nav-title {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .nav-detail {
      display: block;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
    }

    .type-badge,
    .status-badge,
    .chip {
      max-width: 100%;
      min-height: 20px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      color: #cbd9d6;
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      justify-self: start;
    }

    .type-badge {
      color: var(--blue);
      border-color: #314d75;
      font-family: var(--mono);
    }

    .status-badge.ready,
    .chip.good {
      color: var(--green);
      border-color: #456d2e;
    }

    .chip.warn {
      color: var(--amber);
      border-color: #755a27;
    }

    .chip.bad {
      color: var(--rose);
      border-color: #7a4034;
    }

    .group-label {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 8px 2px 2px;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #081011;
    }

    .workspace-header {
      min-height: 70px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line-soft);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 18px;
    }

    .crumb {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .page-title {
      color: var(--text);
      font-size: 22px;
      line-height: 1.12;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subline {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .segment {
      display: inline-grid;
      grid-auto-flow: column;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: var(--field);
    }

    .segment button {
      min-height: 28px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
    }

    .segment button:last-child {
      border-right: 0;
    }

    .segment button.is-active {
      color: var(--text);
      background: #142b2f;
    }

    .empty-state {
      height: 100%;
      min-height: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
      overflow: auto;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
    }

    .empty-panel {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      padding: 12px;
      max-width: 560px;
    }

    .empty-panel .create-line {
      max-width: 420px;
      margin-top: 10px;
    }

    .recent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
      max-width: 900px;
    }

    .editor-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .meta-panel {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line-soft);
      background: #0a1416;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 112px 112px;
      gap: 8px;
      align-items: end;
    }

    .meta-panel label:nth-child(4),
    .meta-panel label:nth-child(5) {
      grid-column: 1 / -1;
    }

    label {
      min-width: 0;
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .editor-panes {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      overflow: hidden;
    }

    .pane {
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    .pane textarea {
      height: 100%;
      border: 0;
      border-radius: 0;
      background: #071011;
    }

    .preview-surface {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 28px 34px 60px;
      line-height: 1.62;
      color: #e7f1ee;
    }

    .preview-surface h1 {
      font-size: 26px;
      line-height: 1.15;
      margin: 0 0 18px;
    }

    .preview-surface h2 {
      color: var(--blue);
      font-size: 18px;
      margin: 24px 0 10px;
    }

    .preview-surface h3 {
      color: #d8e9e5;
      font-size: 15px;
      margin: 18px 0 8px;
    }

    .preview-surface p,
    .preview-surface ul,
    .preview-surface blockquote {
      max-width: 820px;
      margin: 0 0 12px;
    }

    .preview-surface ul {
      padding-left: 22px;
    }

    .preview-surface blockquote {
      border-left: 2px solid var(--line);
      padding-left: 12px;
      color: var(--muted);
    }

    .wiki-link {
      color: var(--amber);
      text-decoration: none;
      border-bottom: 1px solid rgba(243, 190, 79, 0.45);
      cursor: pointer;
    }

    .wiki-link.exists {
      color: #aee7ff;
      border-bottom-color: rgba(142, 216, 255, 0.45);
    }

    .context-head {
      min-height: 70px;
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .context-title {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .context-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px 12px 22px;
    }

    .context-section {
      margin-bottom: 14px;
    }

    .context-section h2 {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 6px;
    }

    .info-row,
    .diagnostic-row {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #091315;
      padding: 8px 9px;
    }

    .info-row button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      min-height: 0;
      display: block;
      text-align: left;
    }

    .row-title {
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-detail {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }

    .diagnostic-row.ready {
      border-color: #456d2e;
    }

    .diagnostic-row.warning {
      border-color: #755a27;
    }

    .diagnostic-row.error {
      border-color: #7a4034;
    }

    .muted {
      color: var(--muted);
    }

    .hint {
      border: 1px dashed var(--line);
      border-radius: 4px;
      color: var(--muted);
      padding: 10px;
      font-size: 12px;
      line-height: 1.4;
      background: #091315;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1100px) {
      body {
        overflow: auto;
      }

      .app,
      .app.has-context {
        min-width: 0;
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }

      .sidebar,
      .context {
        max-height: none;
        border: 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .context,
      .app.has-context .context {
        display: flex;
      }

      .workspace {
        min-height: 680px;
      }

      .meta-panel {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <div class="mark">NW</div>
          <div>
            <div class="brand-title">Nymphs World</div>
            <div class="server-line" id="serverLine">Starting</div>
          </div>
        </div>
        <div class="sidebar-actions">
          <button id="refreshBtn" title="Refresh world index">Refresh</button>
          <button id="demoBtn" title="Create demo world">Demo</button>
        </div>
      </div>

      <section class="section">
        <div class="section-head">
          <span>Worlds</span>
          <span class="count" id="projectCount">0</span>
        </div>
        <div class="create-line">
          <input id="projectTitle" placeholder="World title" autocomplete="off">
          <button class="icon primary" id="createProjectBtn" title="Create world">+</button>
        </div>
        <div class="nav-list project-list" id="projectList"></div>
      </section>

      <section class="section pages">
        <div class="section-head">
          <span>Pages</span>
          <span class="count" id="pageCount">0</span>
        </div>
        <div class="search-line">
          <input id="pageSearch" placeholder="Search pages" autocomplete="off">
        </div>
        <div class="create-line page-create">
          <input id="pageTitle" placeholder="Page title" autocomplete="off">
          <select id="pageType" title="Page type">
            <option value="character">character</option>
            <option value="place">place</option>
            <option value="faction">faction</option>
            <option value="story_arc">story arc</option>
            <option value="quest">quest</option>
            <option value="beat">beat</option>
            <option value="scene">scene</option>
            <option value="dialogue_thread">dialogue</option>
            <option value="item">item</option>
            <option value="system">system</option>
            <option value="lore">lore</option>
            <option value="scratch">scratch</option>
          </select>
          <button class="icon primary" id="createPageBtn" title="Create page">+</button>
        </div>
        <div class="nav-list page-list" id="pageList"></div>
      </section>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div>
          <div class="crumb" id="projectLabel">// no world selected</div>
          <h1 class="page-title" id="pageHeading">No page open</h1>
          <div class="subline" id="pageSubline">Create or select a world.</div>
        </div>
        <div class="header-actions">
          <div class="segment" id="modeSegment" aria-label="Editor mode">
            <button data-mode="write" class="is-active">Write</button>
            <button data-mode="preview">Preview</button>
            <button data-mode="source">Source</button>
          </div>
          <button id="saveBtn" class="primary" disabled>Save</button>
        </div>
      </header>

      <section id="emptyState" class="empty-state">
        <div class="empty-title">No world open</div>
        <div class="empty-panel">
          <div class="muted" id="emptyMessage">Create a world or select one from the left rail.</div>
          <div class="create-line">
            <input id="emptyProjectTitle" placeholder="World title" autocomplete="off">
            <button class="icon primary" id="emptyCreateProjectBtn" title="Create world">+</button>
          </div>
        </div>
        <div class="recent-grid" id="recentWorlds"></div>
      </section>

      <section id="editorView" class="editor-view hidden">
        <div class="meta-panel">
          <label>
            Title
            <input id="metaTitle" autocomplete="off">
          </label>
          <label>
            Type
            <select id="metaType">
              <option value="character">character</option>
              <option value="place">place</option>
              <option value="faction">faction</option>
              <option value="story_arc">story arc</option>
              <option value="quest">quest</option>
              <option value="beat">beat</option>
              <option value="scene">scene</option>
              <option value="dialogue_thread">dialogue</option>
              <option value="item">item</option>
              <option value="system">system</option>
              <option value="lore">lore</option>
              <option value="scratch">scratch</option>
            </select>
          </label>
          <label>
            Status
            <select id="metaStatus">
              <option value="draft">draft</option>
              <option value="candidate">candidate</option>
              <option value="canon">canon</option>
              <option value="needs_work">needs work</option>
            </select>
          </label>
          <label>
            Summary
            <input id="metaSummary" autocomplete="off">
          </label>
          <label>
            Tags
            <input id="metaTags" placeholder="tag, tag" autocomplete="off">
          </label>
        </div>

        <div class="editor-panes">
          <div id="writePane" class="pane">
            <textarea id="bodyEditor" spellcheck="true" placeholder="Start writing..."></textarea>
          </div>
          <div id="sourcePane" class="pane hidden">
            <textarea id="sourceEditor" spellcheck="false"></textarea>
          </div>
          <div id="previewPane" class="pane hidden">
            <article id="previewHost" class="preview-surface"></article>
          </div>
        </div>
      </section>
    </main>

    <aside class="context" id="contextPanel">
      <div class="context-head">
        <div class="context-title">Context</div>
        <div class="mini-actions" id="contextCounts"></div>
      </div>
      <div class="context-body">
        <section class="context-section">
          <h2>Backlinks</h2>
          <div class="stack" id="backlinkList"></div>
        </section>
        <section class="context-section">
          <h2>Links</h2>
          <div class="stack" id="outlinkList"></div>
        </section>
        <section class="context-section">
          <h2>Assets</h2>
          <div class="stack" id="assetList"></div>
        </section>
        <section class="context-section">
          <h2>Vault Checks</h2>
          <div class="stack" id="diagnosticList"></div>
        </section>
      </div>
    </aside>
  </div>

  <script>
    const state = {
      projects: [],
      project: null,
      index: null,
      page: null,
      meta: {},
      body: "",
      source: "",
      dirty: false,
      saving: false,
      editorMode: "write",
      pageSearch: ""
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function normalizeLink(value) {
      return String(value || "")
        .split("|", 1)[0]
        .split("#", 1)[0]
        .trim()
        .replace(/\s+/g, " ")
        .toLocaleLowerCase();
    }

    function slugTitle(path) {
      const stem = String(path || "").split("/").pop().replace(/\.md$/i, "");
      return stem.replace(/[-_]+/g, " ");
    }

    function compactProjectPath(path) {
      const text = String(path || "").replace(/^\/home\/[^/]+\//, "~/");
      return text.length > 44 ? `...${text.slice(-41)}` : text;
    }

    function compactPagePath(path) {
      return String(path || "").replace(/^world\//, "");
    }

    function cleanScalar(value) {
      return String(value ?? "").replace(/[\r\n]+/g, " ").trim();
    }

    function parseTags(value) {
      if (Array.isArray(value)) return value.map(cleanScalar).filter(Boolean);
      return String(value || "")
        .split(",")
        .map(cleanScalar)
        .filter(Boolean);
    }

    function badge(text, kind = "") {
      return `<span class="chip ${kind}">${escapeHtml(text)}</span>`;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || response.statusText);
      }
      return data;
    }

    function parseFrontmatterText(raw) {
      const data = {};
      for (const line of String(raw || "").split(/\r?\n/)) {
        if (!line.includes(":")) continue;
        const index = line.indexOf(":");
        const key = line.slice(0, index).trim();
        const value = line.slice(index + 1).trim();
        if (!key) continue;
        if (value.startsWith("[") && value.endsWith("]")) {
          data[key] = value.slice(1, -1).split(",").map((item) => item.trim().replace(/^["']|["']$/g, "")).filter(Boolean);
        } else {
          data[key] = value.replace(/^["']|["']$/g, "");
        }
      }
      return data;
    }

    function splitDocument(content) {
      const text = String(content || "");
      if (!text.startsWith("---\n")) {
        return { meta: {}, body: text };
      }
      const end = text.indexOf("\n---\n", 4);
      if (end < 0) {
        return { meta: {}, body: text };
      }
      return {
        meta: parseFrontmatterText(text.slice(4, end)),
        body: text.slice(end + 5)
      };
    }

    function documentFromStructured() {
      const tags = parseTags(state.meta.tags);
      const lines = [
        "---",
        `id: ${cleanScalar(state.meta.id || state.page?.id || "nw-page")}`,
        `type: ${cleanScalar(state.meta.type || "lore")}`,
        `title: ${cleanScalar(state.meta.title || state.page?.title || "Untitled Page")}`,
        `status: ${cleanScalar(state.meta.status || "draft")}`,
        `tags: [${tags.join(", ")}]`,
        `summary: ${cleanScalar(state.meta.summary || "")}`
      ];
      if (cleanScalar(state.meta.image || "")) {
        lines.push(`image: ${cleanScalar(state.meta.image)}`);
      }
      lines.push("---", "");
      return `${lines.join("\n")}${state.body.replace(/^\n+/, "")}`;
    }

    function setDirty(value) {
      state.dirty = value;
      updateSaveUi();
    }

    function updateSaveUi() {
      const saveBtn = $("saveBtn");
      saveBtn.disabled = !state.page || !state.dirty || state.saving;
      saveBtn.textContent = !state.page ? "Save" : state.saving ? "Saving" : state.dirty ? "Save" : "Saved";
    }

    function setMode(mode) {
      if (!state.page) return;
      if (state.editorMode === "source" && mode !== "source") {
        const parsed = splitDocument(state.source);
        state.meta = { ...state.meta, ...parsed.meta };
        state.body = parsed.body;
        syncFieldsFromState();
      }
      if (state.editorMode !== "source" && mode === "source") {
        state.source = documentFromStructured();
        $("sourceEditor").value = state.source;
      }
      state.editorMode = mode;
      renderMode();
    }

    function renderMode() {
      $("writePane").classList.toggle("hidden", state.editorMode !== "write");
      $("sourcePane").classList.toggle("hidden", state.editorMode !== "source");
      $("previewPane").classList.toggle("hidden", state.editorMode !== "preview");
      document.querySelectorAll("#modeSegment button").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.mode === state.editorMode);
      });
      if (state.editorMode === "preview") {
        renderPreview();
      }
    }

    function syncSourceFromStructured() {
      state.source = documentFromStructured();
    }

    function setBody(value) {
      state.body = value;
      syncSourceFromStructured();
      setDirty(true);
      if (state.editorMode === "preview") renderPreview();
    }

    function updateHeadingForTitle(title) {
      const cleanTitle = cleanScalar(title);
      if (!cleanTitle) return;
      if (state.body.startsWith("# ")) {
        state.body = state.body.replace(/^# .*(\r?\n|$)/, `# ${cleanTitle}\n`);
      }
    }

    function setMetaField(key, value) {
      state.meta[key] = value;
      if (key === "title") {
        state.page.title = value;
        updateHeadingForTitle(value);
        if (state.editorMode === "write") {
          $("bodyEditor").value = state.body;
        }
      }
      syncSourceFromStructured();
      setDirty(true);
      renderHeader();
      renderContext();
      if (state.editorMode === "preview") renderPreview();
    }

    async function loadServerInfo() {
      const info = await api("/server_info");
      $("serverLine").textContent = `Vault ${compactProjectPath(info.projects_root)}`;
    }

    async function loadProjects() {
      const data = await api("/api/projects");
      state.projects = data.projects || [];
      renderProjects();
      renderEmptyState();
      if (!state.project && state.projects.length) {
        await selectProject(state.projects[0].id);
      } else {
        renderAll();
      }
    }

    async function loadProjectIndex(projectId) {
      const index = await api(`/api/projects/${encodeURIComponent(projectId)}/index`);
      state.project = index.project;
      state.index = index;
      return index;
    }

    async function selectProject(projectId) {
      await loadProjectIndex(projectId);
      state.page = null;
      state.meta = {};
      state.body = "";
      state.source = "";
      state.dirty = false;
      state.editorMode = "write";
      renderAll();
      if (state.index.pages?.length) {
        await selectPage(state.index.pages[0].id);
      }
    }

    async function selectPage(pageId, keepMode = false) {
      if (!state.project) return;
      const record = await api(`/api/projects/${encodeURIComponent(state.project.id)}/pages/${encodeURIComponent(pageId)}`);
      const parsed = splitDocument(record.content || "");
      state.page = record;
      state.meta = {
        id: parsed.meta.id || record.id || "",
        type: parsed.meta.type || record.type || "lore",
        title: parsed.meta.title || record.title || "Untitled Page",
        status: parsed.meta.status || record.status || "draft",
        tags: parsed.meta.tags || record.tags || [],
        summary: parsed.meta.summary || record.summary || "",
        image: parsed.meta.image || record.image || ""
      };
      state.body = parsed.body;
      state.source = record.content || documentFromStructured();
      state.dirty = false;
      if (!keepMode) state.editorMode = "write";
      renderAll();
    }

    function renderAll() {
      $("app").classList.toggle("has-context", Boolean(state.page));
      renderProjects();
      renderPages();
      renderHeader();
      renderEditor();
      renderEmptyState();
      renderContext();
      updateSaveUi();
      renderMode();
    }

    function renderProjects() {
      $("projectCount").textContent = String(state.projects.length);
      const list = $("projectList");
      if (!state.projects.length) {
        list.innerHTML = `<div class="hint">No worlds yet.</div>`;
        return;
      }
      list.innerHTML = state.projects.map((project) => `
        <button class="nav-row ${state.project?.id === project.id ? "is-active" : ""}" data-project="${escapeHtml(project.id)}">
          <span>
            <span class="nav-title">${escapeHtml(project.title)}</span>
            <span class="nav-detail">${escapeHtml(project.id)}${project.updated_at ? ` · ${escapeHtml((project.updated_at || "").slice(0, 10))}` : ""}</span>
          </span>
        </button>
      `).join("");
      list.querySelectorAll("[data-project]").forEach((button) => {
        button.addEventListener("click", () => selectProject(button.dataset.project));
      });
    }

    function renderPages() {
      const list = $("pageList");
      const pages = state.index?.pages || [];
      $("pageCount").textContent = state.project ? String(pages.length) : "0";
      if (!state.project) {
        list.innerHTML = `<div class="hint">No world selected.</div>`;
        return;
      }
      const query = state.pageSearch.trim().toLocaleLowerCase();
      const filtered = pages.filter((page) => {
        const haystack = `${page.title} ${page.type} ${page.status} ${page.path}`.toLocaleLowerCase();
        return !query || haystack.includes(query);
      });
      if (!filtered.length) {
        list.innerHTML = `<div class="hint">${query ? "No matching pages." : "No pages yet."}</div>`;
        return;
      }
      const groups = new Map();
      for (const page of filtered) {
        const key = page.type || "uncategorized";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(page);
      }
      list.innerHTML = Array.from(groups.entries()).map(([type, items]) => `
        <div class="group-label">${escapeHtml(type.replaceAll("_", " "))}</div>
        ${items.map((page) => `
          <button class="nav-row ${state.page?.id === page.id ? "is-active" : ""}" data-page="${escapeHtml(page.id)}">
            <span>
              <span class="nav-title">${escapeHtml(page.title)}</span>
              <span class="nav-detail">${escapeHtml(compactPagePath(page.path))} · ${escapeHtml(page.status || "draft")}</span>
            </span>
          </button>
        `).join("")}
      `).join("");
      list.querySelectorAll("[data-page]").forEach((button) => {
        button.addEventListener("click", () => selectPage(button.dataset.page));
      });
    }

    function renderHeader() {
      $("projectLabel").textContent = state.project ? `// ${state.project.title}` : "// no world selected";
      $("pageHeading").textContent = state.page ? (state.meta.title || state.page.title) : "No page open";
      if (state.page) {
        $("pageSubline").textContent = `${compactPagePath(state.page.path)} · ${state.meta.status || "draft"}`;
      } else if (state.project) {
        $("pageSubline").textContent = "Select or create a page.";
      } else {
        $("pageSubline").textContent = "Create or select a world.";
      }
    }

    function syncFieldsFromState() {
      $("metaTitle").value = state.meta.title || "";
      $("metaType").value = state.meta.type || "lore";
      $("metaStatus").value = state.meta.status || "draft";
      $("metaSummary").value = state.meta.summary || "";
      $("metaTags").value = parseTags(state.meta.tags).join(", ");
      $("bodyEditor").value = state.body || "";
      $("sourceEditor").value = state.source || documentFromStructured();
    }

    function renderEditor() {
      $("emptyState").classList.toggle("hidden", Boolean(state.page));
      $("editorView").classList.toggle("hidden", !state.page);
      if (!state.page) return;
      syncFieldsFromState();
      renderPreview();
    }

    function renderEmptyState() {
      const recent = $("recentWorlds");
      if (!state.projects.length) {
        recent.innerHTML = "";
        $("emptyMessage").textContent = "No worlds in this workspace yet.";
        return;
      }
      $("emptyMessage").textContent = state.project ? "No page open." : "Recent worlds";
      document.querySelector(".empty-title").textContent = state.project ? "No page open" : "No world open";
      recent.innerHTML = state.projects.slice(0, 8).map((project) => `
        <button class="nav-row" data-project="${escapeHtml(project.id)}">
          <span>
            <span class="nav-title">${escapeHtml(project.title)}</span>
            <span class="nav-detail">${escapeHtml(project.id)}${project.updated_at ? ` · ${escapeHtml((project.updated_at || "").slice(0, 10))}` : ""}</span>
          </span>
        </button>
      `).join("");
      recent.querySelectorAll("[data-project]").forEach((button) => {
        button.addEventListener("click", () => selectProject(button.dataset.project));
      });
    }

    function findPageByLink(rawTarget) {
      const wanted = normalizeLink(rawTarget);
      const pages = state.index?.pages || [];
      return pages.find((page) => {
        return normalizeLink(page.title) === wanted
          || normalizeLink(page.id) === wanted
          || normalizeLink(slugTitle(page.path)) === wanted;
      });
    }

    function renderInline(value) {
      const escaped = escapeHtml(value);
      return escaped.replace(/\[\[([^\]]+)\]\]/g, (_, raw) => {
        const target = normalizeLink(raw);
        const page = findPageByLink(raw);
        const label = String(raw).split("|").pop();
        return `<a class="wiki-link ${page ? "exists" : ""}" href="#" data-wikilink="${escapeHtml(target)}">${escapeHtml(label)}</a>`;
      });
    }

    function renderPreview() {
      const host = $("previewHost");
      const body = state.editorMode === "source" ? splitDocument(state.source).body : state.body;
      const lines = String(body || "").split(/\r?\n/);
      const html = [];
      let inList = false;
      for (const line of lines) {
        if (line.startsWith("- ")) {
          if (!inList) {
            html.push("<ul>");
            inList = true;
          }
          html.push(`<li>${renderInline(line.slice(2))}</li>`);
          continue;
        }
        if (inList) {
          html.push("</ul>");
          inList = false;
        }
        if (!line.trim()) {
          continue;
        }
        if (line.startsWith("# ")) {
          html.push(`<h1>${renderInline(line.slice(2))}</h1>`);
        } else if (line.startsWith("## ")) {
          html.push(`<h2>${renderInline(line.slice(3))}</h2>`);
        } else if (line.startsWith("### ")) {
          html.push(`<h3>${renderInline(line.slice(4))}</h3>`);
        } else if (line.startsWith("> ")) {
          html.push(`<blockquote>${renderInline(line.slice(2))}</blockquote>`);
        } else {
          html.push(`<p>${renderInline(line)}</p>`);
        }
      }
      if (inList) html.push("</ul>");
      host.innerHTML = html.join("") || `<p class="muted">Empty page.</p>`;
      host.querySelectorAll("[data-wikilink]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          const targetPage = findPageByLink(link.dataset.wikilink || link.textContent);
          if (targetPage) selectPage(targetPage.id, true);
        });
      });
    }

    function currentOutlinks() {
      const source = state.editorMode === "source" ? splitDocument(state.source).body : state.body;
      const matches = [...String(source || "").matchAll(/\[\[([^\]]+)\]\]/g)];
      const seen = new Set();
      return matches.map((match) => match[1]).filter((raw) => {
        const key = normalizeLink(raw);
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderContext() {
      if (!state.page) return;
      const counts = state.index?.counts || {};
      $("contextCounts").innerHTML = [
        badge(`${counts.pages || 0} pages`, "good"),
        badge(`${counts.broken_links || 0} broken`, counts.broken_links ? "warn" : "good")
      ].join("");

      const pages = state.index?.pages || [];
      const backlinkIds = state.page.backlinks || [];
      const backlinks = backlinkIds.map((id) => pages.find((page) => page.id === id)).filter(Boolean);
      $("backlinkList").innerHTML = backlinks.map((page) => `
        <div class="info-row">
          <button data-page="${escapeHtml(page.id)}">
            <div class="row-title">${escapeHtml(page.title)}</div>
            <div class="row-detail">${escapeHtml(compactPagePath(page.path))}</div>
          </button>
        </div>
      `).join("") || `<div class="hint">No backlinks.</div>`;
      $("backlinkList").querySelectorAll("[data-page]").forEach((button) => {
        button.addEventListener("click", () => selectPage(button.dataset.page, true));
      });

      const links = currentOutlinks();
      $("outlinkList").innerHTML = links.map((raw) => {
        const page = findPageByLink(raw);
        return `
          <div class="info-row">
            ${page ? `<button data-page="${escapeHtml(page.id)}">` : "<div>"}
              <div class="row-title">${escapeHtml(String(raw).split("|").pop())}</div>
              <div class="row-detail">${page ? escapeHtml(compactPagePath(page.path)) : "Missing page"}</div>
            ${page ? "</button>" : "</div>"}
          </div>
        `;
      }).join("") || `<div class="hint">No outgoing links.</div>`;
      $("outlinkList").querySelectorAll("[data-page]").forEach((button) => {
        button.addEventListener("click", () => selectPage(button.dataset.page, true));
      });

      const assets = state.index?.assets || [];
      const attached = assets.filter((asset) => asset.entity_id === state.page.id || String(state.body).includes(asset.path));
      $("assetList").innerHTML = attached.map((asset) => `
        <div class="info-row">
          <div class="row-title">${escapeHtml(asset.path)}</div>
          <div class="row-detail">${escapeHtml(asset.extension || "asset")}</div>
        </div>
      `).join("") || `<div class="hint">No assets attached.</div>`;

      const diagnostics = state.index?.diagnostics || [];
      const relevant = diagnostics.filter((diagnostic) => !diagnostic.path || diagnostic.path === state.page.path).slice(0, 5);
      $("diagnosticList").innerHTML = relevant.map((diagnostic) => `
        <div class="diagnostic-row ${escapeHtml(diagnostic.severity)}">
          <div class="row-title">${escapeHtml(diagnostic.title)}</div>
          <div class="row-detail">${escapeHtml(diagnostic.detail)}</div>
        </div>
      `).join("") || `<div class="hint">No page checks.</div>`;
    }

    async function createProjectFromInput(inputId) {
      const input = $(inputId);
      const title = input.value.trim();
      if (!title) return;
      const project = await api("/api/projects", {
        method: "POST",
        body: JSON.stringify({ title })
      });
      $("projectTitle").value = "";
      $("emptyProjectTitle").value = "";
      await loadProjects();
      await selectProject(project.id);
    }

    async function createDemo() {
      const project = await api("/api/demo", { method: "POST", body: "{}" });
      await loadProjects();
      await selectProject(project.id);
    }

    async function createPage() {
      if (!state.project) return;
      const title = $("pageTitle").value.trim();
      if (!title) return;
      const page = await api(`/api/projects/${encodeURIComponent(state.project.id)}/pages`, {
        method: "POST",
        body: JSON.stringify({
          title,
          type: $("pageType").value,
          summary: ""
        })
      });
      $("pageTitle").value = "";
      await loadProjectIndex(state.project.id);
      await selectPage(page.id);
    }

    async function savePage() {
      if (!state.project || !state.page || state.saving) return;
      state.saving = true;
      updateSaveUi();
      const content = state.editorMode === "source" ? state.source : documentFromStructured();
      const saved = await api(`/api/projects/${encodeURIComponent(state.project.id)}/pages/${encodeURIComponent(state.page.id)}`, {
        method: "PUT",
        body: JSON.stringify({ content })
      });
      await loadProjectIndex(state.project.id);
      state.saving = false;
      await selectPage(saved.id, true);
    }

    $("refreshBtn").addEventListener("click", async () => {
      const projectId = state.project?.id;
      const pageId = state.page?.id;
      await loadProjects();
      if (projectId) {
        await loadProjectIndex(projectId);
        if (pageId) await selectPage(pageId, true);
      }
      renderAll();
    });
    $("demoBtn").addEventListener("click", createDemo);
    $("createProjectBtn").addEventListener("click", () => createProjectFromInput("projectTitle"));
    $("emptyCreateProjectBtn").addEventListener("click", () => createProjectFromInput("emptyProjectTitle"));
    $("createPageBtn").addEventListener("click", createPage);
    $("saveBtn").addEventListener("click", savePage);
    $("pageSearch").addEventListener("input", (event) => {
      state.pageSearch = event.target.value;
      renderPages();
    });
    $("pageTitle").addEventListener("keydown", (event) => {
      if (event.key === "Enter") createPage();
    });
    $("projectTitle").addEventListener("keydown", (event) => {
      if (event.key === "Enter") createProjectFromInput("projectTitle");
    });
    $("emptyProjectTitle").addEventListener("keydown", (event) => {
      if (event.key === "Enter") createProjectFromInput("emptyProjectTitle");
    });
    $("bodyEditor").addEventListener("input", (event) => setBody(event.target.value));
    $("sourceEditor").addEventListener("input", (event) => {
      state.source = event.target.value;
      setDirty(true);
    });
    $("metaTitle").addEventListener("input", (event) => setMetaField("title", event.target.value));
    $("metaType").addEventListener("change", (event) => setMetaField("type", event.target.value));
    $("metaStatus").addEventListener("change", (event) => setMetaField("status", event.target.value));
    $("metaSummary").addEventListener("input", (event) => setMetaField("summary", event.target.value));
    $("metaTags").addEventListener("input", (event) => setMetaField("tags", event.target.value));
    document.querySelectorAll("#modeSegment button").forEach((button) => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    (async function init() {
      try {
        await loadServerInfo();
        await loadProjects();
      } catch (error) {
        $("serverLine").textContent = error.message;
        renderAll();
      }
    })();
  </script>
</body>
</html>
